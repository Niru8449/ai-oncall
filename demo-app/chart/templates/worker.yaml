apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "storefront.labels" (dict "app" "worker" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        {{- include "storefront.labels" (dict "app" "worker" "root" $) | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: {{ include "storefront.image" (dict "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8000
          env:
            - name: ROLE
              value: worker
            {{- include "storefront.env" .Values.worker.env | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    {{- include "storefront.labels" (dict "app" "worker" "root" $) | nindent 4 }}
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
