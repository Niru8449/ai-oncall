apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "storefront.labels" (dict "app" "api" "root" $) | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        {{- include "storefront.labels" (dict "app" "api" "root" $) | nindent 8 }}
    spec:
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.initContainer.enabled }}
      initContainers:
        - name: wait
          image: {{ include "storefront.image" (dict "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ROLE
              value: wait
            - name: WAIT_FOR
              value: {{ .Values.api.initContainer.waitFor | quote }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "storefront.image" (dict "root" $ "override" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.api.command }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ROLE
              value: api
            {{- include "storefront.env" .Values.api.env | nindent 12 }}
            {{- if .Values.api.withDatabaseUrl }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.dbSecretName }}
                  key: DATABASE_URL
            {{- end }}
            - name: SHOP_NAME
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: {{ .Values.api.configMapKey }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessProbe.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: /uploads
              readOnly: {{ .Values.api.uploadsReadOnly }}
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "storefront.labels" (dict "app" "api" "root" $) | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    {{- include "storefront.labels" (dict "app" "api" "root" $) | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      app: api
{{- end }}
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    {{- include "storefront.labels" (dict "app" "api" "root" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPU }}
{{- end }}
