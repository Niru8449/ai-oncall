apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry
  namespace: harness
  labels:
    app: registry
spec:
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: registry
          image: localhost:5000/storefront:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: registry
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
