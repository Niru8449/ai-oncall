apiVersion: apps/v1
kind: Deployment
metadata:
  name: slo-probe
  namespace: harness
  labels:
    app: slo-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slo-probe
  template:
    metadata:
      labels:
        app: slo-probe
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: slo-probe
          image: localhost:5000/storefront:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8000
          env:
            - name: ROLE
              value: slo-probe
            - name: TARGET
              value: http://api.storefront.svc.cluster.local/orders
            - name: INTERVAL_S
              value: "1"
            - name: TIMEOUT_S
              value: "2"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: slo-probe
  namespace: harness
  labels:
    app: slo-probe
spec:
  selector:
    app: slo-probe
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: slo-probe
  namespace: harness
spec:
  selector:
    matchLabels:
      app: slo-probe
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s
