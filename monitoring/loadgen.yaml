apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: harness
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: storefront:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: loadgen
            - name: TARGET
              value: http://api.storefront.svc.cluster.local/orders
            - name: RPS
              value: "20"
            - name: MAX_INFLIGHT
              value: "200"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
