apiVersion: v1
kind: ServiceAccount
metadata:
  name: oncall-agent
  namespace: storefront
---
apiVersion: v1
kind: Secret
metadata:
  name: oncall-agent-token
  namespace: storefront
  annotations:
    kubernetes.io/service-account.name: oncall-agent
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oncall-agent-read
  namespace: storefront
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oncall-agent-read
  namespace: storefront
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oncall-agent-read
subjects:
  - kind: ServiceAccount
    name: oncall-agent
    namespace: storefront
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oncall-agent-write
  namespace: storefront
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [patch, update]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oncall-agent-write
  namespace: storefront
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oncall-agent-write
subjects:
  - kind: ServiceAccount
    name: oncall-agent
    namespace: storefront
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oncall-agent-nodes-read
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [storefront]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oncall-agent-nodes-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oncall-agent-nodes-read
subjects:
  - kind: ServiceAccount
    name: oncall-agent
    namespace: storefront
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oncall-agent-prometheus
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames:
      - mon-kube-prometheus-stack-prometheus
      - "http:mon-kube-prometheus-stack-prometheus:9090"
      - "http:mon-kube-prometheus-stack-prometheus:http-web"
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oncall-agent-prometheus
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oncall-agent-prometheus
subjects:
  - kind: ServiceAccount
    name: oncall-agent
    namespace: storefront
