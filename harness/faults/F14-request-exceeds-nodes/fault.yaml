id: F14
title: Request bigger than any node
category: resources
inject:
  - helm upgrade storefront demo-app/chart -n storefront --reuse-values --set api.resources.requests.memory=64Gi --set api.resources.limits.memory=64Gi
alert: RolloutStuck
expected: fix
root_cause: unschedulable_resources
acceptable_actions:
  - { tool: rollback, target: deploy/api }
needs_fresh_cluster: false
time_budget_s: 600
settle_s: 0
sealed: false
loadgen_rps: 20
cleanup: []
reset: helm
