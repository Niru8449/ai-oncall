id: F20
title: Service points at the wrong port
category: network
inject:
  - kubectl -n storefront patch service api --type json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":8081}]'
alert: default
expected: propose
root_cause: service_port
acceptable_actions:
  - { tool: patch_service, target: svc/api }
needs_fresh_cluster: false
time_budget_s: 600
settle_s: 0
sealed: false
loadgen_rps: 20
cleanup: []
reset: helm
