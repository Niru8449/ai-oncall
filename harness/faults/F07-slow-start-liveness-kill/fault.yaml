id: F07
title: Slow start killed by liveness probe
category: startup
inject:
  - helm upgrade storefront demo-app/chart -n storefront --reuse-values --set api.env.STARTUP_DELAY_S=45
alert: RolloutStuck
expected: fix
root_cause: probe_misconfig
acceptable_actions:
  - { tool: rollback, target: deploy/api }
  - { tool: patch_probe, target: deploy/api }
needs_fresh_cluster: false
time_budget_s: 600
settle_s: 0
sealed: true
loadgen_rps: 20
cleanup: []
reset: helm
