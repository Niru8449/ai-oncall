id: F10
title: Init container waits forever
category: startup
inject:
  - helm upgrade storefront demo-app/chart -n storefront --reuse-values --set api.initContainer.enabled=true --set api.initContainer.waitFor=inventory:8080
alert: RolloutStuck
expected: fix
root_cause: init_blocked
acceptable_actions:
  - { tool: rollback, target: deploy/api }
needs_fresh_cluster: false
time_budget_s: 600
settle_s: 0
sealed: false
loadgen_rps: 20
cleanup: []
reset: helm
