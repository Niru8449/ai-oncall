id: F11
title: Memory limit below the app's working set
category: resources
inject:
  - kubectl -n storefront set resources deploy/api --requests=memory=96Mi --limits=memory=96Mi
alert: default
expected: fix
root_cause: oom_killed
acceptable_actions:
  - { tool: raise_limits, target: deploy/api }
  - { tool: rollback, target: deploy/api }
needs_fresh_cluster: false
time_budget_s: 600
settle_s: 0
sealed: false
loadgen_rps: 20
cleanup: []
reset: helm
