name: nightly self-test

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  KIND_VERSION: v0.33.0

jobs:
  self-test:
    name: ${{ matrix.category }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: startup
            skip: ""
          - category: resources
            skip: F18
          - category: network
            skip: F25,F26
          - category: rollouts
            skip: ""
          - category: storage
            skip: ""
          - category: deps
            skip: ""
          - category: traps
            skip: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the harness dependencies
        run: pip install -r requirements.txt

      - name: Install kind (pinned, checksum verified)
        run: |
          curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind-linux-amd64.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind

      - name: Create a one-node sandbox
        run: python harness/sandbox.py create ci --nodes 1

      - name: Build the app image and load it into the sandbox
        run: python harness/run.py --sandbox ci --build

      - name: Install monitoring, the app and the harness workloads
        run: python harness/run.py --sandbox ci --bootstrap

      - name: Self-test, one category, no agent
        run: python harness/run.py --sandbox ci --self-test --category ${{ matrix.category }} --skip "${{ matrix.skip }}" --seed 7

      - name: Keep the run rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.category }}
          path: reports/runs/
          if-no-files-found: ignore
